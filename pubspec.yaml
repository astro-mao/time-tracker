name: time_tracker_app
description: 时间记录 App（安卓端）— 点击事件开始计时，看板统计，CSV 导出
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3          # 本地 SQLite 数据库
  path: ^1.9.0             # 路径拼接
  path_provider: ^2.1.2    # 获取临时/应用目录，用于导出文件
  share_plus: ^7.2.0       # 系统分享（导出 CSV）
  cross_file: ^0.3.3       # XFile，配合分享
  file_picker: '>=8.1.2 <8.2.0'  # 选文件（导入 CSV）；锁 8.1.x 避免 cross_file 版本冲突

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
