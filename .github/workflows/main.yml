name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 这一行是"构建脚本版本指纹"。日志里能看到它，说明仓库里的 .github 是新版；
      # 看不到 = 你推上去的还是旧 workflow（图标/签名那几步根本不存在）。
      - name: 0. Workflow revision
        run: |
          echo "WORKFLOW-REV: 2026-11-27-SELFCONTAINED-v4.1"
          echo "如果上面这行不是 SELFCONTAINED-v4.1，说明 .github/workflows/main.yml 没更新到仓库"

      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3. Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: 4. Locate source
        run: |
          echo "candidates:"
          find . -maxdepth 3 -name pubspec.yaml -not -path './.git/*' | sort
          APP_DIR=""
          BEST=999
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            d=$(dirname "$f")
            if [ -f "$d/lib/main.dart" ] && grep -q "sqflite" "$f"; then
              depth=$(printf '%s' "$d" | awk -F'/' '{print NF}')
              if [ "$depth" -lt "$BEST" ]; then
                BEST=$depth
                APP_DIR=$d
              fi
            fi
          done <<< "$(find . -maxdepth 3 -name pubspec.yaml -not -path './.git/*' | sort)"
          if [ -z "$APP_DIR" ]; then
            echo "::error::No valid source found (need pubspec.yaml + lib/main.dart). Upload src first."
            exit 1
          fi
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Using project: $APP_DIR (depth $BEST)"
          ls -la "$APP_DIR"
          ls "$APP_DIR/lib"

      - name: 5. Fix pubspec automatically
        run: |
          cd "$APP_DIR"
          echo "--- pubspec before ---"
          head -n 25 pubspec.yaml
          sed -i '1s/^\xEF\xBB\xBF//' pubspec.yaml
          sed -i 's/\r$//' pubspec.yaml
          sed -i -E 's/^([[:space:]]*)cross_file:.*/\1cross_file: ^0.3.3/' pubspec.yaml
          echo "--- pubspec after ---"
          head -n 25 pubspec.yaml

      - name: 6. Create android scaffold
        run: |
          cd "$APP_DIR"
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "android folder missing or incomplete, rebuilding it"
            rm -rf android
            flutter create --platforms=android --org com.example --project-name time_tracker_app /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
          fi
          ls android/app

      - name: 6a. Install app logo (图标数据已内嵌在本文件里)
        run: |
          cd "$APP_DIR"
          # 【为什么图标数据写在文件里，而不是读 icons/ 文件夹】
          # 上次图标没换的真正原因是：上传到 GitHub 时 icons/ 之类的目录没跟着上去，
          # 而旧 workflow 里根本没有装图标这一步，于是"构建成功但图标还是 Flutter"。
          # 现在 PNG 直接 base64 内嵌在本文件里 —— 只要本文件是对的，图标就一定能装上。
          ICONS_DIR=/tmp/tt_icons
          rm -rf "$ICONS_DIR"
          mkdir -p "$ICONS_DIR"

          # 写入单个密度图标，并校验字节数；字节数不对 = 文件被截断，直接红叉
          put_icon () {
            DENSITY="$1"
            EXPECT="$2"
            mkdir -p "$ICONS_DIR/$DENSITY"
            base64 -d > "$ICONS_DIR/$DENSITY/ic_launcher.png"
            SZ=$(stat -c%s "$ICONS_DIR/$DENSITY/ic_launcher.png")
            if [ "$SZ" != "$EXPECT" ]; then
              echo "::error::图标数据不完整（$DENSITY 实际 ${SZ}B，应为 ${EXPECT}B）：main.yml 粘贴时被截断，请重新完整复制"
              exit 1
            fi
            echo "icon ok: $DENSITY ${SZ}B"
          }

