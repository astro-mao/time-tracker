          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          echo "sdk=$SDK"
          echo "aapt=$AAPT"
          echo "apksigner=$APKSIGNER"
          {
            echo "### APK 自检（版本号 / 图标 / 签名）"
            echo '```'
            if [ -n "$AAPT" ]; then
              "$AAPT" dump badging "$APK" | grep -E "^package:|application-label:|application-icon-" || true
            else
              echo "::warning::aapt not found, skip badging"
            fi
            echo '```'
            echo "### 签名证书（CN 应为 TimeTracker，且每次构建保持不变）"
            echo '```'
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs "$APK" 2>&1 | head -12 || true
            else
              echo "::warning::apksigner not found, skip cert check"
            fi
            echo '```'
