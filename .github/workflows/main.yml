name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Locate project root
        run: |
          if [ -f pubspec.yaml ] && [ -f lib/main.dart ]; then
            echo "APP_DIR=." >> "$GITHUB_ENV"
          elif [ -f time_tracker_app/pubspec.yaml ] && [ -f time_tracker_app/lib/main.dart ]; then
            echo "APP_DIR=time_tracker_app" >> "$GITHUB_ENV"
          else
            echo "::error::找不到 pubspec.yaml 或 lib/main.dart，代码没有正确上传到仓库"
            exit 1
          fi

      - name: Verify app source
        run: |
          echo "APP_DIR=$APP_DIR"
          if ! grep -q "sqflite" "$APP_DIR/pubspec.yaml"; then
            echo "::error::pubspec.yaml 里没有 sqflite 依赖，上传的不是时间记录 App 的代码"
            exit 1
          fi
          echo "source check passed"

      - name: Create android scaffold if missing
        run: |
          cd "$APP_DIR"
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name time_tracker_app /tmp/scaffold
            cp -r /tmp/scaffold/android .
          fi
          ls android

      - name: Pub get
        run: cd "$APP_DIR" && flutter pub get

      - name: Build release APK
        run: cd "$APP_DIR" && flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: time-tracker-apk
          path: "**/flutter-apk/*-release.apk"
          if-no-files-found: error
