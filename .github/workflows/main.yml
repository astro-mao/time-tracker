          cat > "$ICONS_DIR/install_icons.py" <<'PYICON'
          #!/usr/bin/env python3
          """把 App logo 与中文名称安装进 Android 工程（品牌化）。

          三件事：
            1) 用仓库里的图标 PNG 覆盖 mipmap-*/ic_launcher.png 与 ic_launcher_round.png
            2) 删除 mipmap-anydpi-v26 里的 ic_launcher*.xml，让所有安卓版本统一用 PNG
               （安卓 8+ 会优先读 adaptive 配置，只换 PNG 不生效）
            3) 修正 AndroidManifest.xml：
               - android:label -> 中文应用名（默认是工程名 time_tracker_app，桌面显示很难看）
               - android:icon  -> @mipmap/ic_launcher（防止历史遗留的 android/ 目录指向别处）
               - android:roundIcon -> @mipmap/ic_launcher_round

          用法:
            python3 install_icons.py <android/app/src/main/res 路径> <icons 源目录> [应用名]
          """
          import os
          import re
          import sys
          import glob
          import shutil

          DENSITIES = [
              'mipmap-mdpi', 'mipmap-hdpi', 'mipmap-xhdpi',
              'mipmap-xxhdpi', 'mipmap-xxxhdpi',
          ]

          DEFAULT_LABEL = '时间记录'


          def patch_manifest(manifest_path: str, label: str) -> bool:
              """修正应用名与图标引用。返回是否成功。"""
              if not os.path.isfile(manifest_path):
                  print('::error::cannot find AndroidManifest.xml: ' + manifest_path)
                  return False

              with open(manifest_path, encoding='utf-8') as f:
                  src = f.read()
              orig = src

              # 只替换 <application> 标签里的第一个 android:label（Activity 上也可能有 label，
              # 但 application 的一定在最前面）
              src, n_label = re.subn(r'android:label="[^"]*"',
                                     'android:label="%s"' % label, src, count=1)
              src, n_icon = re.subn(r'android:icon="[^"]*"',
                                    'android:icon="@mipmap/ic_launcher"', src, count=1)
              src, n_round = re.subn(r'android:roundIcon="[^"]*"',
                                     'android:roundIcon="@mipmap/ic_launcher_round"', src, count=1)

              if n_label == 0:
                  # 极少数模板没有 label，补一个到 application 上
                  src, n2 = re.subn(r'<application\b',
                                    '<application\n        android:label="%s"' % label, src, count=1)
                  n_label = n2

              if src != orig:
                  with open(manifest_path, 'w', encoding='utf-8') as f:
                      f.write(src)

              print('manifest: label patched=%d, icon patched=%d, roundIcon patched=%d'
                    % (n_label, n_icon, n_round))
              print('manifest: current label -> %s' % label)
              return n_label > 0


          def main(res_dir: str, icons_dir: str, label: str = DEFAULT_LABEL) -> None:
              if not os.path.isdir(res_dir):
                  print('::error::cannot find android res dir: ' + res_dir)
                  sys.exit(1)

              installed = 0
              for d in DENSITIES:
                  src = os.path.join(icons_dir, d, 'ic_launcher.png')
                  if not os.path.isfile(src):
                      print('::warning::missing icon: ' + src)
                      continue
                  dst_dir = os.path.join(res_dir, d)
                  os.makedirs(dst_dir, exist_ok=True)
                  shutil.copyfile(src, os.path.join(dst_dir, 'ic_launcher.png'))
                  shutil.copyfile(src, os.path.join(dst_dir, 'ic_launcher_round.png'))
                  installed += 1
                  print('installed icon -> ' + d)

              if installed == 0:
                  print('::error::no icon installed')
                  sys.exit(1)

              # 移除 adaptive 配置，否则 API 26+ 仍显示 Flutter 默认图标
              adv_dir = os.path.join(res_dir, 'mipmap-anydpi-v26')
              if os.path.isdir(adv_dir):
                  for f in glob.glob(os.path.join(adv_dir, 'ic_launcher*.xml')):
                      os.remove(f)
                      print('removed adaptive config: ' + os.path.basename(f))

              # res 的上一级就是 src/main，AndroidManifest.xml 在那里
              manifest = os.path.join(os.path.dirname(os.path.abspath(res_dir)),
                                      'AndroidManifest.xml')
              if not patch_manifest(manifest, label):
                  print('::error::应用名写入失败，桌面仍会显示 time_tracker_app')
                  sys.exit(1)

              print('branding installed OK (%d densities)' % installed)


          if __name__ == '__main__':
              if len(sys.argv) not in (3, 4):
                  print('usage: install_icons.py <res_dir> <icons_dir> [app_label]')
                  sys.exit(1)
              main(sys.argv[1], sys.argv[2], sys.argv[3] if len(sys.argv) == 4 else DEFAULT_LABEL)
          PYICON
          python3 "$ICONS_DIR/install_icons.py" android/app/src/main/res "$ICONS_DIR" "时间记录"
          echo "ICONS_DIR=$ICONS_DIR" >> "$GITHUB_ENV"

          # 应用名自检：桌面名字来自 AndroidManifest 的 android:label。
