name: Build Android APK

# 本工作流在 GitHub 的云端(x86-64 Ubuntu)上打包安卓 APK，
# 你自己的电脑不需要安装 Flutter / Android SDK，全程零本地环境。
# 打出来的是 debug 版 APK，手机可直接安装测试。

on:
  # 允许在 GitHub 网页的 Actions 标签里手动点一下就运行
  workflow_dispatch:
  # 也可以：每次往 main/master 推代码时自动打包
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 安装 Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: 安装 Android SDK 并接受协议
        uses: android-actions/setup-android@v3

      - name: 安装 Android 编译依赖 (platform + build-tools) 并同意许可
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: 补全安卓工程脚手架(首次需要)
        # 我们的仓库只提交了 lib/ 和 pubspec.yaml，安卓原生工程由这一步自动生成
        run: flutter create --platforms=android .

      - name: 拉取 Dart 依赖
        run: flutter pub get

      - name: 编译 APK (debug，免签名，手机可直接安装)
        run: flutter build apk --debug

      - name: 上传 APK 作为可下载产物
        uses: actions/upload-artifact@v4
        with:
          name: time-tracker-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
